name: macOS arm64 source CLI verification

on:
  workflow_dispatch:
  pull_request:

permissions: {}

jobs:
  tagged-source-cli:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.10"
      - name: Verify native target
        run: python -c "import platform,struct,sys; assert sys.version_info[:3]==(3,12,10); assert struct.calcsize('P')==8; assert platform.machine()=='arm64'"
      - name: Verify tagged-source CLI route
        run: bash packaging/verify_macos_cli.sh
